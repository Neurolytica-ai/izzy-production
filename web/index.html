<!doctype html>
<!--
  lang and dir are placeholders. The real values come from GET /api/meta/config
  and are applied by src/main.tsx before the app renders, so the document
  direction always matches UI_LANG on the server rather than being hardcoded in
  two places that can disagree.
-->
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Izzy Yogev — Production Management &amp; Control</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
