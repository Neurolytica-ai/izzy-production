# WP §10.2 — app + Nginx reverse proxy. The database is NOT here: it lives on
# Supabase (managed Postgres), reached via DATABASE_URL in .env.
#
#   docker compose up -d --build
#
# See docs/DEPLOY.md for the full first-time deploy (server hardening, TLS).
#
# The three moving parts:
#   app    — the Node API (compiled), reachable only inside the compose network.
#   assets — a one-shot that copies the front end built into the app image into a
#            shared volume, so nginx serves it. `public/` is gitignored and does
#            not exist on a fresh clone, so this is what puts the site on disk.
#   nginx  — serves the static front end and proxies /api to app; terminates TLS.

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
    expose:
      - '3000'
    # Not published to the host: Nginx is the only way in.
    networks:
      - internal

  # Populates the web-root volume from the front end baked into the app image.
  # Runs to completion on every `up` (so a rebuilt front end is picked up), then
  # exits; nginx waits for it to finish before starting.
  assets:
    build: .
    # root, because the named volume is root-owned and the app image's default
    # user (node) could not write into it.
    user: root
    command: sh -c "rm -rf /pub/* && cp -a /app/public/. /pub/"
    volumes:
      - web-public:/pub
    restart: 'no'
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
      assets:
        condition: service_completed_successfully
    ports:
      - '80:80'
      - '443:443'   # nothing listens here until active.conf is the HTTPS config
    volumes:
      # The live-selected config: deploy copies nginx/default.conf (HTTP) or
      # nginx/https.conf (TLS) to nginx/active.conf. See docs/DEPLOY.md.
      - ./nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
      - web-public:/var/www/public:ro
      # Certbot webroot (challenge files) + issued certificates.
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt:ro
    networks:
      - internal

  # Certificate issuance and renewal. Behind the "tools" profile so it never
  # starts on a plain `docker compose up`; invoke it explicitly:
  #   issue:   docker compose run --rm certbot certonly --webroot \
  #              -w /var/www/certbot -d srv1859122.hstgr.cloud \
  #              --email <you@example.com> --agree-tos --no-eff-email
  #   renew:   docker compose run --rm certbot renew
  #            (then: docker compose exec nginx nginx -s reload)
  certbot:
    image: certbot/certbot:latest
    profiles: ['tools']
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt

  # Optional self-hosted Postgres instead of Supabase.
  # db:
  #   image: postgres:16-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #     POSTGRES_DB: izy
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   networks:
  #     - internal

networks:
  internal:

volumes:
  web-public:
  certbot-webroot:
  certbot-certs:
  # pgdata:
