# WP §10.2 — Nginx terminates HTTP(S), serves the static front end and proxies
# /api to the Node app.
#
# This is the HTTP-ONLY bootstrap config. It is valid with no certificate on
# disk, so it is what the server runs on the first `docker compose up` and while
# Let's Encrypt issues the certificate over the ACME challenge below.
#
# It is NOT mounted directly — deploy copies the chosen template to
# nginx/active.conf (see docs/DEPLOY.md):
#   cp nginx/default.conf nginx/active.conf      # HTTP only (bootstrap)
#   cp nginx/https.conf   nginx/active.conf      # HTTPS (after the cert exists)
#
# Host: srv1859122.hstgr.cloud  (Hostinger per-server DNS, A record → the server)

upstream app {
  server app:3000;
  keepalive 16;
}

server {
  listen 80;
  server_name srv1859122.hstgr.cloud;

  # Hebrew filenames and content.
  charset utf-8;
  charset_types text/css application/javascript application/json text/plain;

  client_max_body_size 25m;   # Excel uploads (WP §9)

  # ACME challenge, so the certificate can be issued without downtime.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # ---- API -----------------------------------------------------------------
  location /api/ {
    proxy_pass http://app;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # Excel import/export of a full month can be slow; do not cut it off.
    proxy_read_timeout    120s;
    proxy_send_timeout    120s;
    proxy_request_buffering off;
  }

  # ---- static front end ----------------------------------------------------
  root /var/www/public;
  index index.html;

  # Hashed build assets can be cached hard; index.html must not be.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-store";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
