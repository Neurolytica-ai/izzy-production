# WP §10.2 — production HTTPS config for srv1859122.hstgr.cloud.
#
# Use this ONLY after the certificate exists, otherwise nginx will not start
# (ssl_certificate points at files that would not yet be there). Deploy switches
# to it by copying it over the live config and reloading (see docs/DEPLOY.md):
#   cp nginx/https.conf nginx/active.conf
#   docker compose restart nginx
#
# Certificate files come from the certbot volume, issued to this exact host.

upstream app {
  server app:3000;
  keepalive 16;
}

# ---- plain HTTP: ACME + permanent redirect to HTTPS ------------------------
server {
  listen 80;
  server_name srv1859122.hstgr.cloud;

  # Renewals still validate over HTTP, so keep the challenge reachable.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ---- HTTPS -----------------------------------------------------------------
server {
  listen 443 ssl;
  http2 on;
  server_name srv1859122.hstgr.cloud;

  charset utf-8;
  charset_types text/css application/javascript application/json text/plain;

  ssl_certificate     /etc/letsencrypt/live/srv1859122.hstgr.cloud/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/srv1859122.hstgr.cloud/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;

  # Tell browsers to stick to HTTPS. Kept to one year; no preload/subdomains
  # since this is a single host on a shared Hostinger domain.
  add_header Strict-Transport-Security "max-age=31536000" always;

  client_max_body_size 25m;   # Excel uploads (WP §9)

  # ---- API -----------------------------------------------------------------
  location /api/ {
    proxy_pass http://app;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    proxy_read_timeout    120s;
    proxy_send_timeout    120s;
    proxy_request_buffering off;
  }

  # ---- static front end ----------------------------------------------------
  root /var/www/public;
  index index.html;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-store";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
