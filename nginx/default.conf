# WP §10.2 — Nginx terminates HTTP(S), serves the static front end and proxies
# /api to the Node app.
#
# TLS is commented out because this deployment has no domain yet and Let's
# Encrypt cannot issue for a bare IP. When a hostname exists:
#   1. point an A record at the server
#   2. uncomment the certbot service and the 443 port mapping in docker-compose
#   3. issue the certificate, then uncomment the TLS server block below
#   4. set COOKIE_SECURE=true in .env  (a Secure cookie is dropped over plain
#      HTTP, so flipping it before TLS breaks login entirely)

upstream app {
  server app:3000;
  keepalive 16;
}

server {
  listen 80;
  server_name _;

  # Hebrew filenames and content.
  charset utf-8;
  charset_types text/css application/javascript application/json text/plain;

  client_max_body_size 25m;   # Excel uploads (WP §9)

  # ACME challenge, so certificates can be issued without downtime later.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # ---- API -----------------------------------------------------------------
  location /api/ {
    proxy_pass http://app;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # Excel import/export of a full month can be slow; do not cut it off.
    proxy_read_timeout    120s;
    proxy_send_timeout    120s;
    proxy_request_buffering off;
  }

  # ---- static front end ----------------------------------------------------
  root /var/www/public;
  index index.html;

  # Hashed build assets can be cached hard; index.html must not be.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-store";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}

